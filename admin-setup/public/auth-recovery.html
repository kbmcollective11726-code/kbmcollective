<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KBM Connect — Reset password</title>
  <meta name="theme-color" content="#0f172a" />
  <style>
    html, body { margin: 0; padding: 0; min-height: 100%; background: #0f172a; }
    .wrap {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 32px 20px 48px;
      color: #f8fafc;
      max-width: 400px;
      margin: 0 auto;
    }
    h1 { font-size: 22px; margin: 0 0 8px; text-align: center; }
    .lead { font-size: 15px; color: #94a3b8; text-align: center; margin: 0 0 24px; line-height: 1.5; }
    #status { font-size: 17px; margin: 0 0 8px; text-align: center; }
    #detail { font-size: 15px; color: #94a3b8; margin: 0; text-align: center; line-height: 1.5; }
    #reset-form { display: none; }
    label { display: block; font-size: 14px; color: #cbd5e1; margin-bottom: 6px; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px 16px;
      margin-bottom: 14px;
      border: 1px solid #334155;
      border-radius: 10px;
      background: #1e293b;
      color: #f8fafc;
      font-size: 16px;
    }
    button[type="submit"] {
      width: 100%;
      padding: 14px 16px;
      margin-top: 8px;
      border: none;
      border-radius: 10px;
      background: #1e4f8a;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button[type="submit"]:disabled { opacity: 0.6; cursor: wait; }
    #form-error { color: #f87171; font-size: 14px; margin: 12px 0 0; text-align: center; min-height: 1.2em; }
    #success-view { display: none; text-align: center; }
    #success-view h1 { color: #4ade80; }
    .spinner { text-align: center; padding: 24px 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="loading-view" class="spinner">
      <p id="status">Verifying your reset link…</p>
      <p id="detail">Please wait.</p>
    </div>

    <div id="reset-form">
      <h1>Set your new password</h1>
      <p class="lead">Choose a password with at least 8 characters. You will sign in to KBM Connect with this password.</p>
      <form id="password-form">
        <label for="password">New password</label>
        <input id="password" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters" />
        <label for="confirm">Confirm password</label>
        <input id="confirm" type="password" autocomplete="new-password" minlength="8" required placeholder="Type it again" />
        <button type="submit" id="submit-btn">Save password</button>
        <p id="form-error" role="alert"></p>
      </form>
    </div>

    <div id="success-view">
      <h1>Password saved</h1>
      <p class="lead">Open <strong>KBM Connect</strong> and sign in with your email and new password.</p>
    </div>

    <div id="error-view" style="display:none">
      <p id="error-status" style="font-size:17px;text-align:center;margin:0 0 8px"></p>
      <p id="error-detail" style="font-size:15px;color:#94a3b8;text-align:center;margin:0;line-height:1.5"></p>
    </div>
  </div>
  <script src="/auth-recovery-config.js"></script>
  <script src="/auth-recovery.js"></script>
</body>
</html>
