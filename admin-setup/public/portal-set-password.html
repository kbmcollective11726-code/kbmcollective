<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KBM Connect — complete registration</title>
  <link rel="icon" href="/logo.png" type="image/png" />
  <meta name="theme-color" content="#0a0a0a" />
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; padding: 24px; max-width: 520px; margin: 0 auto; line-height: 1.5; color: #111; }
    h1 { font-size: 1.25rem; }
    .muted { color: #555; font-size: 0.95rem; }
  </style>
</head>
<body>
  <h1>Opening your portal…</h1>
  <p id="status" class="muted">Finishing your registration sign-in.</p>
  <p id="fallback" class="muted" style="display:none; margin-top:16px;">
    If nothing happens, go back to the registration page and tap <strong>Register delegate</strong> or
    <strong>Register vendor</strong> again to receive a new link.
  </p>
  <script>
    (function () {
      var statusEl = document.getElementById('status');
      var fallbackEl = document.getElementById('fallback');
      var hash = window.location.hash || '';
      var search = window.location.search || '';

      function parseParam(key) {
        try {
          var fromHash = new URLSearchParams(hash.replace(/^#/, ''));
          if (fromHash.get(key)) return fromHash.get(key);
          var fromSearch = new URLSearchParams(search.replace(/^\?/, ''));
          return fromSearch.get(key) || '';
        } catch (e) {
          return '';
        }
      }

      function hasAuthPayload(h, s) {
        var combined = (h || '') + '&' + (s || '');
        if (combined.indexOf('access_token') !== -1) return true;
        if (combined.indexOf('token_hash') !== -1) return true;
        if (/(?:^|[?&#])type=(invite|magiclink|recovery|email|signup)/.test(combined)) return true;
        if (/(?:^|[?&#])code=/.test(combined)) return true;
        return false;
      }

      var err = parseParam('error') || parseParam('error_code');
      var errDesc = parseParam('error_description');

      if (err || errDesc) {
        if (statusEl) statusEl.textContent = errDesc || err || 'This registration link is no longer valid.';
        if (fallbackEl) fallbackEl.style.display = 'block';
        return;
      }

      var eventId = parseParam('event_id');
      var role = parseParam('role');
      if (role !== 'vendor') role = 'delegate';

      if (!eventId) {
        if (statusEl) {
          statusEl.textContent = 'This link is missing event information. Request a new registration email from the event organizer.';
        }
        if (fallbackEl) fallbackEl.style.display = 'block';
        return;
      }

      var connectBase = 'https://connect.kbmcollective.org';
      var targetPath = '/portal/' + encodeURIComponent(eventId) + '/' + role + '/set-password';

      if (!hasAuthPayload(hash, search)) {
        if (statusEl) {
          statusEl.textContent =
            'This link is missing login data (expired, already used, or blocked by email security). Register again for a fresh link.';
        }
        if (fallbackEl) fallbackEl.style.display = 'block';
        window.setTimeout(function () {
          window.location.replace(connectBase + targetPath);
        }, 1200);
        return;
      }

      var hashQuery = hash ? hash.replace(/^#/, '') : '';
      var searchQuery = search ? search.replace(/^\?/, '') : '';
      var passthrough = hashQuery || searchQuery;
      var dest = connectBase + targetPath + (passthrough ? ('#' + passthrough) : '');

      window.location.replace(dest);
      window.setTimeout(function () {
        if (fallbackEl) fallbackEl.style.display = 'block';
        if (statusEl) statusEl.textContent = 'We tried to open the password page. Use the options below if you are stuck.';
      }, 4000);
    })();
  </script>
</body>
</html>
